name: iOS Simulator Build

# Manual only — builds an unsigned .app for the iOS Simulator (no Apple Developer
# account needed). This cannot produce something installable on a physical iPhone;
# that requires a real signing certificate + provisioning profile.
on:
  workflow_dispatch: {}

jobs:
  build-ios-simulator:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync into the iOS project
        run: ./node_modules/.bin/cap sync ios

      - name: Build for iOS Simulator (unsigned)
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios-build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Zip the .app bundle
        run: |
          cd ios-build/Build/Products/Debug-iphonesimulator
          zip -r App-simulator.zip App.app

      - uses: actions/upload-artifact@v4
        with:
          name: TMA-iOS-Simulator-Build
          path: ios-build/Build/Products/Debug-iphonesimulator/App-simulator.zip
          retention-days: 14
